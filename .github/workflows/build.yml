name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan file game
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Buat project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Kunci layar landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UA-HxH-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
