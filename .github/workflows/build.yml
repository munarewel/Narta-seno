name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan file game
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Buat project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Kunci layar landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../UA-HxH.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UA-HxH-APK
          path: UA-HxH.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: UA HxH build ${{ github.run_number }}
          files: UA-HxH.apk
